server:
  port: 9088

  datasource:
    url: jdbc:postgresql://localhost:5432/plan_db
    username: plan_user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
      properties:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}