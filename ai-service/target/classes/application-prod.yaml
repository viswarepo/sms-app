spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pgvector-db
    username: testuser
    password: testpwd
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: document_embedding
        dimensions: 768 # Dimensions for nomic-embed-text
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text

# app-specific settings
support:
  knowledge-base:
    path: classpath:data/*.md
  rag:
    top-k: 4

app:
  rag:
    knowledge-base-path=classpath:knowledge-base.txt: